[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-desktop-sdk"
version = "0.1.0"
description = "Scoped local lifecycle and viewer activity helpers for Neurcro integrations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Neurcro contributors"}]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neuro_desktop_sdk = ["py.typed", "manifest.schema.json"]
